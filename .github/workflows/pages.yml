# The documentation website (ADR-030): site/ built with Starlight and published to GitHub Pages,
# at https://alimardon123.github.io/pondra/. Its examples run in build.yml (tools/docs_check.py),
# against the binary of the same commit.
#
# Once, in the repository's settings: Pages → Build and deployment → Source: "GitHub Actions".
name: Docs

on:
  push:
    tags: ["v*"] # (the site describes what a release does: it is published with each one)
  workflow_dispatch: # (or by hand, from the Actions tab: a fix to the docs between releases)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # (a deploy half done is worse than one more waiting)

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
      - run: python3 ../tools/brand_check.py --site dist   # (its mark and favicon: brand/'s, ADR-032)
        working-directory: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
