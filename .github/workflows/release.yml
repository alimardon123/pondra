name: release

# A tag vX.Y.Z (or a run started by hand): publishes what the build workflow made and tested for
# that very commit (build.yml: the five platforms' wheels, npm packages and installer archives,
# each tried on its platform, and the suite run on the Linux binary) to a GitHub release with
# install.sh and install.ps1, to PyPI and to npm. Nothing is built here, so a release takes a
# minute or two: tag a commit once its build is green. A merge to main that changed nothing in a
# pull request's code isn't built again: its packages are the pull request's (tools/ci_build.sh). A build still running is waited for; one
# that failed stops the release (re-run its failed jobs, then this).
#
# Publishing needs no token: PyPI and npm both trust this workflow ("trusted publishing", with
# the environment `pypi`). A run started by hand checks that the build's packages are all there
# and publishes nothing unless `publish` is ticked (then PyPI and npm, not a GitHub release).
# Pondra is MIT OR Apache-2.0: the packages carry both licenses.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and npm"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04 # (pinned, as the build is: ubuntu-latest becomes 26.04 from 2026-10-19)
    environment: pypi # (PyPI's trusted publisher names it; Settings -> Environments can require an approval)
    permissions:
      actions: read # this commit's build run and its packages
      contents: write # the GitHub release
      id-token: write # PyPI trusted publishing, npm provenance
    steps:
      - uses: actions/checkout@v5 # (Cargo.toml's version, the installers, tools/npm_publish.sh)
      - name: This commit's build run (waited for while it runs; it must have passed)
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow build.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run" ] || { echo "::error::no build run for $GITHUB_SHA: push it to main first (or start the build workflow on this tag)"; exit 1; }
          gh run watch "$run" --exit-status --interval 30 > /dev/null || { echo "::error::build run $run didn't pass: re-run its failed jobs, then this"; exit 1; }
          built=$(bash tools/ci_build.sh "$GITHUB_SHA") # (its own packages, or the pull request's it reused: build.yml's `reuse`)
          [ -n "$built" ] || { echo "::error::build run $run passed, but no run has this commit's packages"; exit 1; }
          echo "run=$built" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          pattern: pondra-*
          path: dist
          merge-multiple: true
      - name: The packages, every platform, of this version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $v"; exit 1; }
          ls -l dist
          for p in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64; do
            a=dist/pondra-$p.tar.gz; [ $p != windows-x64 ] || a=dist/pondra-$p.zip
            ls dist/pondra-$v-*.whl dist/pondra-$p-$v.tgz "$a" > /dev/null || exit 1
          done
          [ "$(ls dist/pondra-$v-*.whl | wc -l)" = 5 ] && ls dist/pondra-$v.tgz
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: GitHub release (with the installers, and how to install at the top)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release.md
          generate_release_notes: true
          files: |
            dist/*
            install.sh
            install.ps1
      - run: mkdir pypi && mv dist/*.whl pypi/
      - name: PyPI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi
          skip-existing: true # (a run started again publishes only what's missing)
      - name: npm (the platform packages first, then `pondra`, which depends on them)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # (empty: npm takes this workflow's OIDC token, as for 0.22.1)
        run: |
          npm install -g npm@latest # (trusted publishing needs npm 11.5.1 or later)
          bash tools/npm_publish.sh --provenance
