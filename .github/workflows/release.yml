name: release

# A tag vX.Y.Z (or a run started by hand): publishes what the build workflow made and tested for
# that very commit (build.yml: the five platforms' wheels, npm packages and installer archives,
# each tried on its platform, and the suite run on the Linux binary; the page's module) to a GitHub
# release with install.sh, install.ps1 and SHA256SUMS, to PyPI and to npm. Nothing is built here, so a release takes a
# minute or two: tag a commit once its build is green. A merge to main that changed nothing in a
# pull request's code isn't built again: its packages are the pull request's (tools/ci_build.sh). A build still running is waited for; one
# that failed stops the release (re-run its failed jobs, then this). Main builds macOS Intel only on a
# version commit, the one a release tags; a tag on any other commit starts the build workflow on
# itself here, which builds every platform, and publishes that run's packages.
#
# Publishing needs no token: PyPI and npm both trust this workflow ("trusted publishing", with
# the environment `pypi`). A run started by hand checks that the build's packages are all there
# and publishes nothing unless `publish` is ticked (then PyPI and npm, not a GitHub release).
# Pondra is MIT OR Apache-2.0: the packages carry both licenses.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and npm"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04 # (pinned, as the build is: ubuntu-latest becomes 26.04 from 2026-10-19)
    environment: pypi # (PyPI's trusted publisher names it; Settings -> Environments can require an approval)
    permissions:
      actions: write # this commit's build run and its packages (and a run of it started, for a tag that needs one)
      contents: write # the GitHub release
      id-token: write # PyPI trusted publishing, npm provenance, the attestations
      attestations: write # (`gh attestation verify <file> -R alimardon123/pondra`: ADR-041)
    steps:
      - uses: actions/checkout@v5 # (Cargo.toml's version, the installers, tools/npm_publish.sh)
      - name: This commit's build run (waited for while it runs; it must have passed)
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow build.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run" ] || { echo "::error::no build run for $GITHUB_SHA: push it to main first (or start the build workflow on this tag)"; exit 1; }
          gh run watch "$run" --interval 30 > /dev/null || true
          ended=$(gh run view "$run" --json conclusion --jq .conclusion)
          # (main builds only its newest commit: a run dropped for a newer push built nothing, and the
          # build workflow is started on the tag below)
          [ "$ended" = success ] || [ "$ended" = cancelled ] || { echo "::error::build run $run didn't pass: re-run its failed jobs, then this"; exit 1; }
          built=$([ "$ended" = cancelled ] || bash tools/ci_build.sh "$GITHUB_SHA") # (its own packages, or the pull request's it reused: build.yml's `reuse`)
          if [ -z "$built" ]; then
            # (a commit that isn't a version commit: main built it without macOS Intel, or not at all)
            echo "Build run $run has no macOS Intel package: starting the build workflow on $GITHUB_REF_NAME, which builds every platform."
            gh workflow run build.yml --ref "$GITHUB_REF_NAME"
            for _ in $(seq 30); do
              sleep 10
              run=$(gh run list --workflow build.yml --commit "$GITHUB_SHA" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
              [ -z "$run" ] || break
            done
            [ -n "$run" ] || { echo "::error::the build workflow started on $GITHUB_REF_NAME didn't show up"; exit 1; }
            gh run watch "$run" --exit-status --interval 60 > /dev/null || { echo "::error::build run $run didn't pass: re-run its failed jobs, then this"; exit 1; }
            built=$(bash tools/ci_build.sh "$GITHUB_SHA")
          fi
          [ -n "$built" ] || { echo "::error::build run $run passed, but no run has this commit's packages"; exit 1; }
          echo "run=$built" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          pattern: pondra-*
          path: dist
          merge-multiple: true
      - name: The packages, every platform, of this version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $v"; exit 1; }
          ls -l dist
          for p in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64; do
            a=dist/pondra-$p.tar.gz; [ $p != windows-x64 ] || a=dist/pondra-$p.zip
            ls dist/pondra-$v-*.whl dist/pondra-$p-$v.tgz "$a" > /dev/null || exit 1
          done
          [ "$(ls dist/pondra-$v-*.whl | wc -l)" = 5 ] && ls dist/pondra-$v.tgz
      - uses: actions/download-artifact@v7 # (the page's module, which build.yml's `web` job built and checked)
        continue-on-error: true # (a run that didn't build it still publishes, below, without the page)
        with:
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          name: web-pkg
          path: web-pkg
      - name: The page's module as one archive, pondra-web.tar.gz (site guides/browser)
        run: |
          if [ -f web-pkg/pondra_web.js ] && [ -f web-pkg/pondra_web_bg.wasm ]; then
            cp LICENSE-MIT LICENSE-APACHE web-pkg/
            tar czf dist/pondra-web.tar.gz -C web-pkg pondra_web.js pondra_web_bg.wasm LICENSE-MIT LICENSE-APACHE
            tar tzvf dist/pondra-web.tar.gz
          else
            echo "::warning::build run ${{ steps.build.outputs.run }} has no web-pkg, so this release has no pondra-web.tar.gz"
          fi
      - name: Every file's SHA-256 (install.sh and install.ps1 check the archive they download against it)
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Every package attested (where it came from, signed with this workflow's identity)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: GitHub release (with the installers, and how to install at the top)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: .github/release.md
          generate_release_notes: true
          files: |
            dist/*
            install.sh
            install.ps1
      - run: mkdir pypi && mv dist/*.whl pypi/
      - name: PyPI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi
          skip-existing: true # (a run started again publishes only what's missing)
      - name: npm (the platform packages first, then `pondra`, which depends on them)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          NODE_AUTH_TOKEN: "" # (setup-node's placeholder otherwise; empty, as 0.33.0 was published, npm takes the OIDC token)
        run: |
          npm install -g npm@12.2.0 # (trusted publishing needs 11.5.1 or later; the build's dry run uses the same)
          bash tools/npm_publish.sh --provenance # (this workflow's OIDC token signs in: no token is kept for npm)
