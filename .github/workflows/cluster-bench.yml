# A Pondra cluster on separate machines, benchmarked: TPC-H on one node and across all of them.
# Runs on main every night on 3 nodes and every Sunday on 6, and when started by hand (Actions →
# cluster-bench → Run workflow). See tools/cloud/actions/README.md for the secrets it needs and
# what it costs.
name: cluster-bench

on:
  schedule:
    - cron: "23 3 * * *" # (3 nodes)
    - cron: "23 5 * * 0" # (6 nodes: the one cron the plan job reads)
  workflow_dispatch:
    inputs:
      nodes:
        description: "Nodes in the cluster"
        default: "3"
      sf:
        description: "TPC-H scale factor (runners have 14 GB of disk: 10 fits, 100 doesn't)"
        default: "10"
      binary:
        description: "ci (the build workflow's, for this commit), build (from this repo's source) or r2 (bench-bin/pondra in the bucket)"
        default: "ci"
      runner:
        description: "Runner label for the nodes"
        default: "ubuntu-24.04"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
  AWS_REGION: auto
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required # (R2 and newer AWS CLIs)
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  binary:
    runs-on: ubuntu-24.04
    permissions:
      actions: read # (the build workflow's runs)
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: The build workflow's, for this commit (what a release publishes; a pull request's, if main reused it)
        if: (inputs.binary || 'ci') == 'ci'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(bash tools/ci_build.sh "$GITHUB_SHA")
          [ -n "$run" ] || { echo "::error::no passing build run for $GITHUB_SHA: wait for it, or use binary: build"; exit 1; }
          gh run download "$run" --name pondra-linux-x64 --dir dl && tar -xzf dl/pondra-linux-x64.tar.gz pondra
      - name: Or build from source
        if: inputs.binary == 'build'
        run: cargo build --profile dist && cp target/dist/pondra pondra
      - name: Or take the one in the bucket
        if: inputs.binary == 'r2'
        run: aws s3 cp "s3://$BUCKET/bench-bin/pondra" pondra
      - uses: actions/upload-artifact@v6
        with: { name: pondra, path: pondra, retention-days: 1 }

  plan:
    runs-on: ubuntu-24.04
    outputs:
      nodes: ${{ steps.n.outputs.nodes }}
      count: ${{ steps.n.outputs.count }}
      sf: ${{ steps.n.outputs.sf }}
    steps:
      - id: n
        # (a scheduled run has no inputs: 3 nodes, or 6 on Sunday's cron; SF10)
        run: |
          n=${{ inputs.nodes || (github.event.schedule == '23 5 * * 0' && '6') || '3' }}
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "sf=${{ inputs.sf || '10' }}" >> "$GITHUB_OUTPUT"
          echo "nodes=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  node:
    needs: [binary, plan]
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.nodes) }}
    steps:
      - uses: actions/download-artifact@v7
        with: { name: pondra }
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: pondra-${{ github.run_id }}-${{ matrix.i }}
      - name: Serve until the driver is done
        run: |
          chmod +x pondra
          ip=$(tailscale ip -4)
          # (256 MB for the driver to download: what the network between the machines carries)
          head -c 268435456 /dev/urandom > blob && (python3 -m http.server 8081 --bind "$ip" > /dev/null 2>&1 &)
          # (every line of the node's log with the time it was written)
          # (PONDRA_DEBUG_SPREAD: each query's spread decision in the log, the guard's estimate with it)
          PONDRA_DEBUG_SPREAD=1 ./pondra serve --dir "s3://$BUCKET/bench-${{ github.run_id }}" --addr "$ip:8080" --cache-gb 4 \
            > >(perl -MPOSIX -pe 'BEGIN { $| = 1 } print strftime("%H:%M:%S ", gmtime)' > node.log) 2>&1 &
          pid=$!
          echo "$ip:8080" | aws s3 cp - "s3://$BUCKET/bench-results/${{ github.run_id }}/nodes/${{ matrix.i }}"
          until aws s3 ls "s3://$BUCKET/bench-results/${{ github.run_id }}/done" > /dev/null 2>&1; do sleep 15; done
          kill -TERM $pid || true # (stopped, as a scheduler stops it: a leader hands its term on)
          sleep 5
      - if: always()
        run: aws s3 cp node.log "s3://$BUCKET/bench-results/${{ github.run_id }}/logs/node-${{ matrix.i }}.log" || true
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: "node-${{ matrix.i }}-log", path: node.log, if-no-files-found: ignore }

  driver:
    needs: [binary, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v7
        with: { name: pondra }
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: pondra-${{ github.run_id }}-driver
      - name: TPC-H data
        run: |
          chmod +x pondra
          pip install tpchgen-cli
          tpchgen-cli -s ${{ needs.plan.outputs.sf }} --format=parquet --output-dir tpch
      - name: Wait for the nodes, run the benchmark
        run: |
          prefix="s3://$BUCKET/bench-results/${{ github.run_id }}"
          until [ "$(aws s3 ls "$prefix/nodes/" | wc -l)" -ge "${{ needs.plan.outputs.count }}" ]; do sleep 10; done
          nodes=$(for i in $(seq 0 $(( ${{ needs.plan.outputs.count }} - 1 ))); do aws s3 cp "$prefix/nodes/$i" -; done | paste -sd, -)
          python3 tools/cloud/actions/driver.py --nodes "$nodes" --lake "s3://$BUCKET/bench-${{ github.run_id }}" \
            --data tpch --queries tools/bench/tpch-queries --bin ./pondra --out results.json
          aws s3 cp results.json "$prefix/results.json"
      - name: Against the last run of as many nodes
        # (the run's own ratio is what counts: runners differ from run to run, so one node and the
        # cluster are timed in the same run; a wrong answer fails it, a cluster slower than one node warns)
        run: |
          last="s3://$BUCKET/bench-results/latest-${{ needs.plan.outputs.count }}.json"
          aws s3 cp "$last" last.json > /dev/null 2>&1 || echo '{}' > last.json
          python3 - <<'PY' || wrong=1
          import json, os, sys
          r, l = json.load(open("results.json")), json.load(open("last.json"))
          r = {k: v for k, v in r.items() if k not in ("queries", "metrics")} | {"commit": "${{ github.sha }}"}
          json.dump(r, open("summary.json", "w"))
          row = lambda x, note="": f"| {x.get('commit', '?')[:7]}{note} | {x.get('load_s')} | {x.get('one_node_s')} | {x.get('cluster_s')} | {x.get('spread')} | {x.get('forced_s')} | {x.get('all_same')} |"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              print("### TPC-H SF${{ needs.plan.outputs.sf }} on ${{ needs.plan.outputs.count }} nodes\n", file=out)
              print("| commit | load s | one node s | cluster s | spread | spread anyway s | same answers |\n|---|---|---|---|---|---|---|", file=out)
              print(row(r), file=out)
              if l: print(row(l, " (last run)"), file=out)
          if r["cluster_s"] > 1.1 * r["one_node_s"]:
              print(f"::warning::the cluster took {r['cluster_s']} s, one node {r['one_node_s']} s")
          if not r["all_same"]:
              print("::error::the cluster's answers differ from one node's")
              sys.exit(1)
          PY
          aws s3 cp summary.json "$last" > /dev/null
          exit ${wrong:-0}
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: results, path: results.json, if-no-files-found: ignore }
      - name: Let the nodes go, and delete the lake
        if: always()
        run: |
          echo done | aws s3 cp - "s3://$BUCKET/bench-results/${{ github.run_id }}/done"
          sleep 30 # (the nodes stop first: a lake deleted under them only makes noise in their logs)
          aws s3 rm --recursive "s3://$BUCKET/bench-${{ github.run_id }}" > /dev/null || true
