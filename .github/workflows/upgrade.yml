# Upgrades (ADR-039): every release's lake since 0.22 opens in this build and answers as it did,
# then carries on; a lake of a newer format is refused; a node drains before it stops (a leader on
# a simulated R2 bucket too, where its followers always have a flush in flight); a cluster
# of the newest release is upgraded to this build a node at a time under load
# (tools/upgrade_check.py all); a table's past: UNDROP and retention (tools/history_check.py, ADR-043);
# branch databases on disk and in a bucket (tools/environments_check.py, ADR-047); a project in Git
# deployed to them (tools/project_check.py).
# build.yml calls it once a pull request's build is done (the label `ci` or `full-ci`): it tries
# the binary that run made, so nothing is compiled here. By hand too.
name: upgrade

on:
  workflow_call:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read # (the build run's packages)
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # (Called from build.yml: its run's own packages, with no API call. By hand: a build run's.)
      - uses: actions/download-artifact@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          name: pondra-linux-x64
          path: dist
      - name: This commit's Linux binary (the build workflow's)
        run: |
          [ -f dist/pondra-linux-x64.tar.gz ] || bash tools/ci_artifact.sh linux-x64 "$SHA"
          mkdir -p target/release && tar xzf dist/pondra-linux-x64.tar.gz -C target/release && ls -l target/release
      - name: Every release's lake, a newer format, drains, a rolling upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }} # (the releases' list: a runner's shared address has a low limit)
        run: |
          set -o pipefail   # (the check's exit status, not tee's)
          pip install -q $(grep -E '^(pyarrow|deltalake|pyiceberg|pyiceberg-core|psycopg\[binary\]|boto3|moto\[server\])==|^boto3$' tools/requirements.txt | sed 's/ *#.*//')
          python3 tools/upgrade_check.py all --new target/release/pondra --work "$RUNNER_TEMP/upgrade" | tee upgrade.json
      - name: A table's past (UNDROP, retention)
        run: |
          set -o pipefail
          python3 tools/history_check.py --new target/release/pondra --work "$RUNNER_TEMP/history" | tee history.json
      - name: Branch databases (CREATE DATABASE dev CLONE prod)
        run: |
          set -o pipefail
          python3 tools/environments_check.py --new target/release/pondra --work "$RUNNER_TEMP/environments" | tee environments.json
      - name: A project in Git made true in a database (pondra plan, deploy, branch, diff)
        run: |
          set -o pipefail
          python3 tools/project_check.py --new target/release/pondra --work "$RUNNER_TEMP/project" | tee project.json
      - name: A leader stopped on a bucket (simulated R2) hands over at once; branches in a bucket
        run: |
          set -o pipefail
          python3 tools/sim_r2.py --port 9000 > "$RUNNER_TEMP/sim_r2.log" 2>&1 &
          export AWS_ENDPOINT=http://127.0.0.1:9000 AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION=auto AWS_ALLOW_HTTP=true PONDRA_BUCKET=testbucket
          for i in $(seq 30); do python3 -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9000', region_name='us-east-1').create_bucket(Bucket='testbucket')" 2>/dev/null && break; sleep 1; done
          python3 tools/upgrade_check.py drain --s3 --new target/release/pondra --work "$RUNNER_TEMP/upgrade-s3" | tee upgrade-s3.json
          python3 tools/environments_check.py --s3 --new target/release/pondra --work "$RUNNER_TEMP/environments-s3" | tee environments-s3.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: upgrade
          path: |
            upgrade.json
            upgrade-s3.json
            history.json
            environments.json
            environments-s3.json
            project.json
            ${{ runner.temp }}/project/**/*.log
            ${{ runner.temp }}/history/*.log
            ${{ runner.temp }}/environments*/**/*.log
            ${{ runner.temp }}/upgrade/**/*.log
            ${{ runner.temp }}/upgrade-s3/**/*.log
          retention-days: 14
          if-no-files-found: ignore
