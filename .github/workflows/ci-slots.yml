name: ci slots

# At most six pull requests' CI at once (two from 2026-10-03, four from 2026-10-11, two again from
# 2026-10-16, since the account's runners are shared with the owner's other work, three from
# 2026-10-17 on GitHub Pro's 40 jobs, six from 2026-11-09, when the owner's other work stopped using
# them: a PR's or the train's run keeps 5 to 6 jobs going on average, 16 in its first minutes, and
# main's build 4.5, so six runs and main's come to about 38 of the 40). The repository variable
# CI_SLOTS says how many, six when it isn't set, and build.yml's plan and tools/train.py read the same: a pull request's run waits while
# that many others are going. It builds nothing and fails its `waiting for a CI slot` check, holding
# no runner. Whenever a pull request's build run
# or the train's (train.yml: one run for the pull requests it merged, which takes a slot too) ends,
# this starts the oldest waiting ones again, as many as there are free slots. A run is started
# again only while it is its pull request's newest and its head is still the pull request's, so a
# newer push is never undone.
#
# It is main's copy that runs (workflow_run), whatever a pull request changes, and it checks out
# nothing: it reads runs and re-runs them. Main's runs, the soak's and the nightly ones aren't
# counted.
on:
  workflow_run:
    workflows: [build]
    types: [completed]

# (one at a time: two ending together mustn't both take the last slot; a later one counts again)
concurrency:
  group: ci-slots
  cancel-in-progress: false

permissions:
  actions: write # (re-running a waiting run)
  contents: read
  pull-requests: read # (the open pull requests' heads)

jobs:
  start:
    name: start waiting pull requests
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'train')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SLOTS: ${{ vars.CI_SLOTS || 6 }}
    steps:
      - run: |
          r=$GITHUB_REPOSITORY
          runs=$(gh api "repos/$r/actions/workflows/build.yml/runs?per_page=100")
          going=$(jq --arg r "$r" '[.workflow_runs[] | select(.status != "completed") | select(.head_repository.full_name == $r) | select(.event == "pull_request" or (.event == "workflow_dispatch" and .head_branch == "train"))] | length' <<< "$runs")
          free=$((SLOTS - going))
          echo "Pull requests' runs going: $going of $SLOTS."
          [ "$free" -gt 0 ] || exit 0
          heads=$(gh pr list --repo "$r" --state open --limit 100 --json number,headRefOid)
          # Each open pull request's newest run (a run for another label is skipped: not counted),
          # if it ended red at its head; oldest first. A run's pull request is the one whose merge it
          # tried (its reusable workflows' ref, refs/pull/N/merge): two pull requests from one branch
          # (a fix and its forward-port, 11-03's #491 and #484) each list both, and taken by the first
          # listed, the one's passed run hid the other's waiting one, which never started again.
          waiting=$(jq -r --argjson heads "$heads" --arg r "$r" '
            [.workflow_runs[] | select(.head_repository.full_name == $r and .event == "pull_request" and .conclusion != "skipped" and (.pull_requests | length) > 0)
             | .pr = ([(.referenced_workflows // [])[].ref | capture("^refs/pull/(?<n>[0-9]+)/").n | tonumber][0] // .pull_requests[0].number)]
            | group_by(.pr) | map(max_by(.id))
            | map(select(.status == "completed" and .conclusion == "failure") | . as $run
                  | select(any($heads[]; .number == $run.pr and .headRefOid == $run.head_sha)))
            | sort_by(.id) | .[].id' <<< "$runs")
          for id in $waiting; do
            [ "$free" -gt 0 ] || break
            # (red for want of a slot, not for a failure: its `waiting for a CI slot` check failed)
            gh api "repos/$r/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "waiting for a CI slot") | .conclusion' | grep -qx failure || continue
            gh run rerun "$id" --repo "$r"
            echo "Started again: https://github.com/$r/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
            free=$((free - 1))
          done
