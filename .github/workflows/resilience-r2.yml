name: resilience-r2

# The bucket's failures (tools/resilience_check.py --real: the storage and cutoff parts) in front of
# real R2 instead of moto: three nodes, each reaching the bucket through its own tools/faulty_s3.py,
# which errs, loses replies, slows, holds and goes down as told, and signs every request again for
# R2. Every acknowledged write must be there once, on every node.
#
# Nightly on main, so a slow day on the network never holds up a merge. A pull request runs it
# only when it changes the proxy or this file and asks for CI (the label `ci` or `full-ci`). The
# bucket and its keys are the cluster bench's secrets (R2_*). The lakes go under resilience/ in the
# bucket and are deleted after every run, whatever happened (R2's free tier is 10 GB).
on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled] # (labeled: `ci` or `full-ci` added)
    paths:
      - tools/faulty_s3.py
      - .github/workflows/resilience-r2.yml
  workflow_dispatch:

concurrency:
  group: resilience-r2 # (one at a time: they share the bucket's resilience/ folder)
  cancel-in-progress: false

permissions:
  actions: read # (the build run's packages)
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
  AWS_REGION: auto
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required # (R2 and newer AWS CLIs and boto3)
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  PONDRA_BUCKET: ${{ secrets.R2_BUCKET }}
  PONDRA_TEST_PREFIX: resilience/

jobs:
  check:
    name: resilience on R2 (storage cutoff)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && (github.event.label.name == 'ci' || github.event.label.name == 'full-ci')) ||
      (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'full-ci')))
    runs-on: ubuntu-24.04
    timeout-minutes: 100 # (most of it waiting for the build's packages)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: boto3 (to delete the lakes)
        run: pip install boto3
      - name: This commit's Linux binary (the build workflow's)
        run: |
          bash tools/ci_artifact.sh linux-x64 "$SHA"
          mkdir -p bin && tar xzf dist/pondra-linux-x64.tar.gz -C bin && ls -l bin
      - name: The checks
        env:
          PONDRA_BIN: ${{ github.workspace }}/bin/pondra
        run: python tools/resilience_check.py --real
      - name: The lakes deleted, whatever happened
        if: always()
        run: aws s3 rm "s3://$PONDRA_BUCKET/resilience/" --recursive --only-show-errors
      - name: The nodes' logs, when a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-r2-logs
          path: /tmp/pondra-*.stderr
          if-no-files-found: ignore
