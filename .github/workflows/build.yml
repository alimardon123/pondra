name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: pondra-linux-x86_64
            bin: target/release/pondra
          - os: windows-latest
            name: pondra-windows-x86_64.exe
            bin: target/release/pondra.exe
          - os: macos-latest
            name: pondra-macos-arm64
            bin: target/release/pondra
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python tools/smoke.py ${{ matrix.bin }} # (on this OS: the shell, SQL, and memory read without /proc)
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.bin }}

  test:
    needs: build # (the Linux binary the build job made: no second compile)
    runs-on: ubuntu-latest
    env:
      PONDRA_BIN: ${{ github.workspace }}/bin/pondra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: pondra-linux-x86_64
          path: bin
      - run: chmod +x bin/pondra
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r tools/requirements.txt
      # The quick correctness suite (upserts, split brain, crashes, clients, Kafka, windows,
      # sums, schemas, scale, Flight…), then a cluster losing its leader twice.
      - run: python3 tools/harness.py all
      - run: python3 tools/cluster.py failover --secs 30
