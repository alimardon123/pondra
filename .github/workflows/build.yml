name: build

# Every push to main: Pondra built as it is released (the dist profile; Linux against glibc 2.17,
# with zig, so it runs on any Linux from 2014 on), tried there (smoke.py), packaged for pip and npm
# and alone for the one-line installers (tools/package.py), and the packages installed and tried as
# users get them (tools/try_packages.sh): linux-x64, linux-arm64, macOS arm64 and Windows, and macOS
# Intel too on a version commit (the one a release tags) or a run started by hand. The website is
# built as `pages.yml` publishes it (a pull request's when it changes `site/` or `brand/`), and the page
# form's module (`web/`) built and checked when it or the core changes. linux-x64
# is built first, on its own, and the suite then runs on its binary in parts side by side, with the
# tests that need only it (upgrade, resilience, sharing, sso), while the other platforms finish.
# A tag's release (release.yml) publishes this run's packages: nothing is built twice, and what
# the suite tested is what ships. A pull request's push runs nothing (its thread builds and tests
# where it works), unless the pull request asks: the label `ci` builds linux-x64 (in the release
# profile, for the runner's glibc) with the suite, and the pull request merges once that passes (the
# owner, 2026-10-16). Its other platforms first build on main, and a failure there is said on the pull
# request (`red`, below) for its lane to fix at once; `full-ci` builds them (but macOS Intel) before
# the merge, for a change that wants them.
# Decided from the labels alone, so a push that asks for nothing never waits for a runner to say so;
# a newer push stops the older run.
# Two pull requests' runs go at once (the account's runners are shared with the owner's other work,
# 2026-10-16): a third waits, holding no runner, until ci-slots.yml starts it. Each run runs only
# what its change touches (`plan`), and main builds only its newest commit (`concurrency`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled] # (labeled: `ci` or `full-ci` added)
  workflow_dispatch:
    inputs:
      mode:
        description: "all: every platform and check (a release's); main: as a push to main (a train landed); train: as a pull request's ci (the train's run)"
        type: choice
        options: [all, main, train]
        default: all

# A pull request's runs share a group, so a newer push (or `full-ci` added) stops the older run.
# Main's pushes share one too, without stopping the run that goes: a push waits while it runs, and
# drops a push that waited before it, so main builds its newest commit, never each merge of a busy
# hour (the account's runners are shared with the owner's other work, 2026-10-16). A run started by
# hand (a release's) has a group of its own, as has another label added. A train's run has one for its
# commit (train.yml): a car stacked on the train runs beside the train's own run, and tools/train.py stops
# the runs of a train it cuts again. The run a landed train starts on main is main's.
concurrency:
  group: build-${{ github.event.pull_request.number || ((github.event_name == 'push' || inputs.mode == 'main') && 'main') || (github.ref == 'refs/heads/train' && format('train-{0}', github.sha)) || github.run_id }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/train' }}

jobs:
  # What this run builds. A push to main whose code a pull request's run already built and tested
  # on every platform (the merge changed nothing in it: the branch was up to date with main)
  # builds nothing: release.yml and cluster-bench.yml take that run's packages (tools/ci_build.sh
  # finds them by the commit's tree). Otherwise main builds every platform but macOS Intel, and it
  # too when the push changes Cargo.toml's version or the run was started by hand. A pull request
  # labelled `ci` builds linux-x64; labelled `full-ci`, all but macOS Intel; with neither, this job
  # and the build are skipped.
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && (github.event.label.name == 'ci' || github.event.label.name == 'full-ci')) ||
      (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'full-ci')))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      linux: ${{ steps.plan.outputs.linux }}
      others: ${{ steps.plan.outputs.others }}
      binary: ${{ steps.plan.outputs.binary }}
      event: ${{ steps.plan.outputs.event }}
      profile: ${{ steps.plan.outputs.profile }}
      packages: ${{ steps.plan.outputs.packages }}
      unit: ${{ steps.plan.outputs.unit }}
      docs: ${{ steps.plan.outputs.docs }}
      suite: ${{ steps.plan.outputs.suite }}
      full: ${{ steps.plan.outputs.full }}
      resilience: ${{ steps.plan.outputs.resilience }}
      upgrade: ${{ steps.plan.outputs.upgrade }}
      sharing: ${{ steps.plan.outputs.sharing }}
      sso: ${{ steps.plan.outputs.sso }}
      deploy: ${{ steps.plan.outputs.deploy }}
      wait: ${{ steps.plan.outputs.wait }}
      site: ${{ steps.plan.outputs.site }}
      web: ${{ steps.plan.outputs.web }}
      forms: ${{ steps.plan.outputs.forms }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # (a commit and its parent: the files it changes, with no API call)
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          MODE: ${{ inputs.mode }}
          PR: ${{ github.event.pull_request.number }}
          SLOTS: ${{ vars.CI_SLOTS || 3 }} # (ci-slots.yml says why)
        run: |
          # (linux-x64 pinned: ubuntu-latest becomes 26.04 from 2026-10-19; moved on purpose, after a
          # green run there. macos-13 was retired; Intel images last until 2027.)
          platforms='[
            {"platform": "linux-x64", "os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "zig": "x86_64-unknown-linux-gnu.2.17"},
            {"platform": "linux-arm64", "os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "zig": "aarch64-unknown-linux-gnu.2.17"},
            {"platform": "macos-x64", "os": "macos-15-intel", "target": "x86_64-apple-darwin"},
            {"platform": "macos-arm64", "os": "macos-latest", "target": "aarch64-apple-darwin"},
            {"platform": "windows-x64", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "exe": ".exe"}]'
          # macOS Intel, the slowest build by far (101 minutes on main's run 650), only where a
          # release needs it: a push that changes Cargo.toml's version (the commit a release tags), or a
          # run started by hand (release.yml starts one on a tag of any other commit).
          # The train's run (train.yml, tools/train.py: lanes' pull requests merged onto main in the branch
          # \`train\`, tested together) is planned as a pull request's \`ci\` run, and the run it starts on main
          # once a train lands as a push to main (a push made with the workflow's token starts no run).
          event=$GITHUB_EVENT_NAME
          if [ "$GITHUB_REF" = refs/heads/train ] || [ "$MODE" = train ]; then event=pull_request; elif [ "$MODE" = main ]; then event=push; fi
          if [ "$event" != pull_request ]; then FULL=true; fi
          echo "event=$event" >> "$GITHUB_OUTPUT"
          # What a change touches decides what runs: nothing for one no check reads (docs/ but its
          # surface and glossary, AGENTS.md, the benches', the soak's and other workflows' own files);
          # the unit tests when the crate or its tests change; the harness when the program, its
          # packages or a check does; the frames, console and docs part for the website too; the other
          # platforms (main, `full-ci`) when what they build or try changes; deploy's, and a pull
          # request's tests after the build, when what each tries changes. A pull request's files are
          # its merge's against main. A push's are those since the newest main commit whose run passed:
          # main runs only its newest commit (`concurrency`), so a run may hold several merges, and a
          # red run's are run again until main passes. Every push builds linux-x64, whose packages the
          # benches, the soak and a release take. A run started by hand, or a push whose last passed
          # run isn't found, runs everything. (The files from git: the API's hourly allowance for the
          # repository runs out on a busy day; one call finds that commit.)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$event" = pull_request ]; then # (a train's: its pull requests' against the main it was cut on)
            base=$(git log -1 --format=%B | sed -n 's/^Train-Base: //p')
            if [ -n "$base" ] && git fetch -q --depth 1 origin "$base"; then files=$(git diff --name-only "$base" HEAD); else files=ALL; fi
          elif [ "$event" = push ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=success&per_page=10" --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // empty') || base=
            if [ "$base" = "$GITHUB_SHA" ]; then base=$(git rev-parse HEAD^1); fi # (a passed run started again)
            if [ -n "$base" ] && git fetch -q --depth 1 origin "$base"; then files=$(git diff --name-only "$base" HEAD); else files=ALL; fi
          else
            files=ALL
          fi
          has() { [ "$files" = ALL ] || grep -qE "$1" <<< "$files"; }
          bin='^(src/|capi/|launcher/|brand/|build\.rs$|tools/(startup_layout\.rs|zig-requirements\.txt)$|Cargo\.(toml|lock)$)' # (the program and the library, their build scripts and linker; startup.yml's due paths)
          pkg='^(python/|js/|install\.(sh|ps1)$|tools/(package|smoke|package_check)\.py$|tools/(package_check\.mjs|try_packages\.sh|npm_publish\.sh|try_install\.ps1)$)' # (the packages, and what tries them)
          self='^\.github/workflows/build\.yml$'
          release=false
          # (what the version is compared with: main's last passed run for a push (`base`: a landed train holds several
          # merges, and the version commit needn't be the last), the main a train was cut on, a pull request's main)
          since=HEAD^1
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$files" != ALL ] && [ -n "$base" ]; then since=$base; fi
          if [ "$event" = workflow_dispatch ] || { [ "$event" = push ] && git diff "$since" HEAD -- Cargo.toml | grep -q '^+version = '; }; then release=true; fi
          # (linux-x64 apart: the suite and the tests after the build start once it is built, and
          # never wait for the slowest platform)
          echo "linux=$(jq -c '{include: [.[] | select(.platform == "linux-x64")]}' <<< "$platforms")" >> "$GITHUB_OUTPUT"
          others=$(jq -c --argjson release "$release" '{include: [.[] | select(.platform != "linux-x64" and ($release or .platform != "macos-x64"))]}' <<< "$platforms")
          echo "others=$others" >> "$GITHUB_OUTPUT"
          if [ "$event" = push ]; then
            # (a run with every package this one would make, `pondra` itself among them)
            run=$(bash tools/ci_build.sh "$GITHUB_SHA" "$(jq -r '[.include[].platform | "pondra-\(.)"] + ["pondra-linux-x64", "pondra-npm"] | join(" ")' <<< "$others")")
            echo "run=$run" >> "$GITHUB_OUTPUT"
            if [ -n "$run" ]; then echo "Built and tested already: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_STEP_SUMMARY"; fi
          fi
          if [ "$FULL" != true ]; then echo "linux-x64 alone (the label \`ci\`): the pull request merges once it passes, and main builds the other platforms (the label \`full-ci\` builds them here first, but macOS Intel)." >> "$GITHUB_STEP_SUMMARY"; fi
          # A pull request's linux-x64 alone (\`ci\`) is built in the release profile, for this runner's
          # glibc: the dist profile's one codegen unit and thin LTO took 23 of a run's 43 minutes (median of
          # 26 runs, 10-14 to 10-17), and the release profile's dependencies are the ones the unit tests
          # cache. What ships is still built as it ships, and its suite run, on main and with \`full-ci\`.
          profile=dist
          # Its packages are named \`pr-linux-x64\`, never \`pondra-linux-x64\`, so nothing takes them for what
          # ships (a release, a bench, the soak, the nightly checks: tools/ci_build.sh and ci_artifact.sh
          # take \`pondra-*\`).
          packages=pondra
          if [ "$event" = pull_request ] && [ "$FULL" != true ]; then profile=release; packages=pr; fi
          # (but in the dist profile, with zig for glibc 2.17, when the change is to what only that build tries: the lock
          # file, a build script or the dist profile. A new dependency that links a newer glibc symbol (invariant 48), or a
          # link the dist profile can't make, is then found before main, not on it)
          dist_profile() { git show "$1:Cargo.toml" 2>/dev/null | awk '/^\[/ { on = index($0, "[profile.dist") == 1 } on'; }
          if [ "$profile" = release ] && { has '(^|/)build\.rs$|^Cargo\.lock$' || [ "$(dist_profile "$since")" != "$(dist_profile HEAD)" ]; }; then
            profile=dist
            echo "linux-x64 in the dist profile, against glibc 2.17: this changes the lock file, a build script or the dist profile, which only that build tries." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ "$FULL" = true ] && [ "$release" = false ]; then echo "macOS Intel is built on a version commit (the one a release tags) or a run started by hand." >> "$GITHUB_STEP_SUMMARY"; fi
          code=false; unit=false; harness=false; docs=false; site=false; deploy=false; full=false
          if has "$bin|$pkg|$self"; then code=true; fi
          if has "$bin|^tests/|^tools/per_node_check\.py\$|$self"; then unit=true; fi
          # (a check, or what one starts: tools/bench/, tools/cloud/, tools/soak.py and tools/train*.py are the benches', the
          # soak's and the merge train's own: train.yml tests the train's)
          if [ "$code" = true ] || [ "$files" = ALL ] || grep -qE '^tools/[^/]+$' <<< "$(grep -vxE 'tools/(soak|train|train_test)\.py' <<< "$files")"; then harness=true; fi
          if [ "$harness" = true ] || has '^(site/|examples/|docs/(surface\.json|glossary\.md)$)'; then docs=true; fi
          if has '^(site/|brand/)|^\.github/workflows/(build|pages)\.yml$'; then site=true; fi
          # (the page form's module, outside the crate's workspace with a lock file of its own: on main and with
          # `full-ci` when the core under it or the module changes, so a core change that breaks it is said on its
          # pull request, `red`, without a pull request's `ci` waiting for a wasm build)
          web=false
          if [ "$FULL" = true ] && has "^(src/|web/|tools/web_|Cargo\.(toml|lock)\$)|$self"; then web=true; fi
          # (and a pull request's, or a train's, when the module itself, the core's list of modules or its
          # dependencies change: the unit tests compile the core without the server feature, but not for wasm32)
          if [ "$event" = pull_request ] && has '^(web/|tools/web_|src/lib\.rs$|Cargo\.toml$)'; then web=true; fi
          # (one set of SQL cases on every form, tools/forms_check.py: whenever a form or the cases change, so the page's
          # module is built for it too, beside linux-x64's build)
          forms=false
          if has "$bin|$pkg|^web/|^tests/forms/|^docs/forms\.json\$|^tools/(forms_check\.py|page_serve\.mjs|slt_check\.py|harness\.py)\$|$self"; then forms=true; web=true; fi
          if [ "$FULL" = true ] && has '^(deploy/|install\.(sh|ps1)$|src/service\.rs$|tools/(image|deploy_check|distribute|sign|package)\.py$|tools/ci_(artifact|build)\.sh$|\.github/workflows/(deploy|deploy-check|build)\.yml$)'; then deploy=true; fi
          if [ "$FULL" = true ] && { [ "$code" = true ] || [ "$deploy" = true ]; }; then full=true; fi
          upgrade=false; resilience=false; sharing=false; sso=false
          # (and the upgrade checks on a release's run too: two pull requests that passed apart are checked together
          # before a tag, on the build the tag publishes)
          if [ "$release" = true ]; then upgrade=true; fi
          if [ "$event" = pull_request ]; then
            if has "$bin|^python/|^tools/(upgrade_check|history_check|environments_check|backup_check|git_check|project_check|fake_github|sim_r2)\.py\$|^tools/(ci_artifact\.sh|requirements\.txt)\$|^\.github/workflows/(upgrade|build)\.yml\$"; then upgrade=true; fi
            if has '^(src/|Cargo\.(toml|lock)$|python/pondra/client\.py$|js/index\.js$|tools/(resilience_check|faulty_s3|sim_r2|harness)\.py$|tools/ci_artifact\.sh$|\.github/workflows/(resilience|build)\.yml$)'; then resilience=true; fi
            if has '^(src/(shares|sharing|vend|read_delta|delta|ext|scan|audit|server)\.rs$|tools/(sharing_check|sim_r2)\.py$|tools/ci_artifact\.sh$|\.github/workflows/(sharing|build)\.yml$)'; then sharing=true; fi
            if has '^(src/(sso|sso_flow|users|auth|pg|flight|kafka|tls|server|dbserver|project)\.rs$|src/console/(core|settings|sso)\.js$|python/pondra/client\.py$|js/index\.js$|tools/fake_idp\.py$|tools/ci_artifact\.sh$|\.github/workflows/(sso|build)\.yml$)'; then sso=true; fi
          fi
          binary=false
          if [ "$event" != pull_request ] || [ "$docs" = true ] || [ "$deploy" = true ] || [ "$upgrade" = true ] || [ "$resilience" = true ] || [ "$sharing" = true ] || [ "$sso" = true ] || [ "$forms" = true ]; then binary=true; fi
          suite=$(jq -nc --argjson h "$harness" --argjson d "$docs" '{include: ((if $h then [range(1; 5) | {part: "harness, \(.) of 4", shard: "\(.)/4"}] else [] end) + (if $d then [{part: "frames, console, docs, failover"}] else [] end))}')
          printf 'binary=%s\nunit=%s\ndocs=%s\nsuite=%s\nsite=%s\nweb=%s\nforms=%s\ndeploy=%s\nfull=%s\nupgrade=%s\nresilience=%s\nsharing=%s\nsso=%s\n' \
            "$binary" "$unit" "$docs" "$suite" "$site" "$web" "$forms" "$deploy" "$full" "$upgrade" "$resilience" "$sharing" "$sso" >> "$GITHUB_OUTPUT"
          runs=
          for k in binary full unit harness docs site web forms upgrade resilience sharing sso deploy; do
            if [ "${!k}" = true ]; then runs="$runs $k"; fi
          done
          echo "Runs:${runs:- nothing (no check reads what this changes)}$([ "$files" != ALL ] || echo ' (everything: started by hand, or no passed run of main found)')." >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # At most SLOTS pull requests' CI at once (ci-slots.yml says how many and why): with that many
            # older runs of other pull requests going, this one waits. It builds nothing, its check
            # `waiting for a CI slot` fails, it holds no runner, and ci-slots.yml starts it again when a
            # run ends.
            # (If the API can't be asked, it runs: a slot is never worth a stuck pull request.)
            # (the train's run takes a slot too: tools/train.py cuts one only with a slot free, and it never waits)
            going=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and .status != \"completed\") | select((.event == \"pull_request\" and (.pull_requests[0].number // 0) != $PR) or (.event == \"workflow_dispatch\" and .head_branch == \"train\"))] | length") || going=0
            if [ "$going" -ge "$SLOTS" ]; then
              echo wait=true >> "$GITHUB_OUTPUT"
              echo "Waiting for a CI slot: $going other pull requests' runs are going ($SLOTS at a time). ci-slots.yml starts this run again when one ends." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  # A pull request over the slots: red until it runs, so nobody takes it for passed.
  slot:
    name: waiting for a CI slot
    needs: plan
    if: needs.plan.outputs.wait == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error title=Waiting for a CI slot::${{ vars.CI_SLOTS || 3 }} other pull requests' CI runs are going, and only that many run at once. This run starts again by itself when one ends (ci-slots.yml): nothing to do."
          exit 1

  # The documentation website, built as pages.yml publishes it with each release, so a page that
  # breaks the build is found on its pull request, not at the release. (Its examples run in the
  # suite: tools/docs_check.py.)
  site:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wait != 'true' && needs.plan.outputs.site == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: python3 ../tools/brand_check.py --site dist   # (its mark and favicon: brand/'s, ADR-032)
        working-directory: site

  # The page form's module (web/, designs/l2-b4-web.md), built for wasm32 as tools/web_build.sh builds it, and its
  # requests in Node checked against their answers, its sizes said (tools/web_check.mjs).
  web:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.wait != 'true' && needs.plan.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web # (its own workspace and target folder; ~/.cargo/bin kept too, wasm-bindgen's command line in it)
          shared-key: web
          cache-on-failure: true
          save-if: ${{ needs.plan.outputs.event != 'pull_request' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: wasm-bindgen's command line, at web/Cargo.lock's version
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' web/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" = "$v" ] || cargo install wasm-bindgen-cli --version "$v" --locked
      - run: bash tools/web_build.sh
      - run: node tools/web_check.mjs --sizes
      - uses: actions/upload-artifact@v6 # (the forms check's page: not pondra-…, which release.yml takes)
        with:
          name: web-pkg
          path: |
            web/pkg/pondra_web.js
            web/pkg/pondra_web_bg.wasm

  # linux-x64 first, on its own: the suite and the tests after the build need its packages alone,
  # so they start once it is built, never waiting for the slowest platform.
  linux:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == '' && needs.plan.outputs.wait != 'true' && needs.plan.outputs.binary == 'true' }}
    name: ${{ matrix.platform }}
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      BIN: ${{ needs.plan.outputs.profile == 'release' && 'target/release/pondra' || format('target/{0}/dist/pondra{1}', matrix.target, matrix.exe) }}
    steps: &build # (every platform's, `build` below too)
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # (the key it had when every platform was the job `build`: main's caches stay theirs; the
          # release profile's are the unit tests')
          shared-key: ${{ needs.plan.outputs.profile == 'release' && 'unit' || 'build' }}
          cache-on-failure: true # (a failed run keeps what it compiled: the dist profile's dependencies take most of a cold build)
          # (main's caches only: every branch reads them, and a branch's own would push them out of
          # the repository's 10 GB; the dependencies are what is cached, and they rarely change)
          save-if: ${{ needs.plan.outputs.event != 'pull_request' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build # (the program, the library and its launcher, into one folder: the packages carry the two, the archive the program)
        # (a dist build links the library first and the programs after it: each links the whole engine with LTO,
        # and the two at once lost linux-arm64's runner, 16 GB, on every main build from #131 on)
        env:
          # (jemalloc, Linux's allocator, takes the build machine's page size and won't start on a
          # kernel with bigger pages: arm64 kernels use 4, 16 or 64 KB (a Raspberry Pi 5, some RHEL),
          # so arm64's is built for 64 KB pages, which runs on all three)
          AARCH64_UNKNOWN_LINUX_GNU_JEMALLOC_SYS_WITH_LG_PAGE: "16"
          # (only builds that ship pay for the startup layout, about 45 s more a link: tools/startup_layout.rs.
          # linux-x64's alone so far: zig's lld has linked it with the script, and arm64's hasn't been tried)
          PONDRA_STARTUP_LAYOUT: ${{ needs.plan.outputs.event != 'pull_request' && matrix.platform == 'linux-x64' && '1' || '' }}
        run: |
          if [ "${{ needs.plan.outputs.profile }}" = release ]; then
            cargo build --release --workspace # (for this runner's glibc: a pull request's packages are tried here, never published)
          elif [ -n "${{ matrix.zig }}" ]; then
            pip install -r tools/zig-requirements.txt
            # (zig's linker says, on every build, that it ignores the -Wl,-O1 rustc passes it: not a warning of ours)
            RUSTFLAGS="-A linker_messages" cargo zigbuild --profile dist --target ${{ matrix.zig }} --workspace --lib
            RUSTFLAGS="-A linker_messages" cargo zigbuild --profile dist --target ${{ matrix.zig }} --workspace
          else
            cargo build --profile dist --target ${{ matrix.target }} --workspace --lib
            cargo build --profile dist --target ${{ matrix.target }} --workspace
          fi
      - run: python tools/smoke.py "$BIN" # (on this OS: the shell, SQL, and memory read without /proc)
      - name: A node in this process, from Python and JavaScript # (tools/inprocess_check.py: connect() with nothing on disk, 50 opens and closes, a fork, the library's ABI)
        if: matrix.platform == 'linux-x64'
        run: python tools/inprocess_check.py --bin "$BIN" --lib "$(dirname "$BIN")/libpondra_lib.so"
      - name: The startup layout held # (a stale tools/startup.txt, which startup.yml traces again each night the code changed, or a build without the script)
        if: matrix.platform == 'linux-x64' && needs.plan.outputs.event != 'pull_request'
        # (read from disk since #205, which drops the program and the library from the page cache first; before it, as
        # just built: the program 26.6 MB on a0eae4f, 29.1-29.8 on main from dcf17f1 to d514755 as the list aged, a build
        # without the layout about 95. The library, which the packages run, is reported until main has measured it)
        run: python tools/startup_order.py check --bin "$BIN" --lib "$(dirname "$BIN")/libpondra_lib.so" --most-mb 31
      # The pip and npm packages and the installers' archive, installed and tried as on a user's
      # machine: packaging that breaks on an OS (npm is npm.cmd on Windows) shows on a push.
      - run: python tools/package.py --bin "$BIN" --platform ${{ matrix.platform }} --npm-main --out dist && bash tools/try_packages.sh ${{ matrix.platform }}
      - name: The Linux wheel on glibc 2.17 (CentOS 7) and on Ubuntu 22.04
        if: matrix.platform == 'linux-x64' && needs.plan.outputs.profile == 'dist'
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/pypa/manylinux2014_x86_64 bash -c \
            "/opt/python/cp311-cp311/bin/python -m pip install -q --only-binary=:all: dist/*.whl 'pyarrow<19' && /opt/python/cp311-cp311/bin/python tools/package_check.py"
          docker run --rm -v "$PWD":/w -w /w ubuntu:22.04 bash -c \
            "apt-get update -qq && apt-get install -y -qq python3-pip > /dev/null && pip install -q dist/*.whl pyarrow && python3 tools/package_check.py"
      - name: The release's npm publish, tried (--dry-run, with the npm the release uses)
        if: matrix.platform == 'linux-x64'
        run: npm install -g npm@12.2.0 && bash tools/npm_publish.sh --dry-run # (the release's npm: release.yml)
      - uses: actions/upload-artifact@v6 # (what release.yml publishes, and cluster-bench.yml can run: `pr-` for a pull request's release-profile build)
        with:
          name: ${{ needs.plan.outputs.packages }}-${{ matrix.platform }}
          path: |
            dist/*.whl
            dist/pondra-${{ matrix.platform }}-*.tgz
            dist/pondra-${{ matrix.platform }}.*
      - uses: actions/upload-artifact@v6 # (`pondra` itself, the same from every platform: published from one)
        if: matrix.platform == 'linux-x64'
        with:
          name: pondra-npm
          path: dist/pondra-[0-9]*.tgz

  # The other platforms (main, macOS Intel only on a version commit or by hand; `full-ci` all but
  # macOS Intel), with the same steps.
  build:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == '' && needs.plan.outputs.wait != 'true' && needs.plan.outputs.full == 'true' }}
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.others) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # (Git Bash on Windows)
    env:
      BIN: target/${{ matrix.target }}/dist/pondra${{ matrix.exe }}
    steps: *build

  # The crate's own unit tests, and a node opened in a host's process (ADR-061), beside linux-x64's
  # build (they need builds of their own: the release profile on this machine, not the dist one zig
  # links for glibc 2.17). The crate is built twice, for its own tests and for a host's, so on two
  # runners: one command compiling both side by side took 23.2 of a train's 24.3 minutes (run 1125,
  # 10-25), and was the run's longest path by 2.4 minutes.
  unit:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == '' && needs.plan.outputs.wait != 'true' && needs.plan.outputs.unit == 'true' }}
    name: unit tests
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: unit
          cache-on-failure: true
          save-if: false # (the host's job saves this key, with the workspace's crates: `host`)
      - run: cargo test --release --lib
      # The core as the page form builds it (web/: no server feature), checked: a module every build has that
      # called one only a node has broke main's browser build after a pull request merged on Linux's CI alone (#131).
      - name: The browser's half of the crate compiles (no server feature)
        run: cargo check --release --lib --no-default-features

  host:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == '' && needs.plan.outputs.wait != 'true' && needs.plan.outputs.unit == 'true' }}
    name: a node in a host's process
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: unit
          cache-on-failure: true
          save-if: ${{ needs.plan.outputs.event != 'pull_request' }} # (main's caches only, as the build's)
      - run: python3 tools/per_node_check.py # (a node leaves nothing of itself in its process: the source alone, ADR-061)
      # Two lakes one after the other in one process, and the library's four checks.
      - run: cargo test --release --test node_twice --test node_library
      # (on main, the workspace too: the cache this job saves is the one a pull request's linux-x64
      # builds from, in the release profile, and the program and the library need a few crates more)
      - if: needs.plan.outputs.event != 'pull_request'
        run: cargo build --release --workspace

  # The suite, on linux-x64's very binary, in five parts side by side: the quick correctness suite
  # (upserts, split brain, crashes, clients, Kafka, windows, sums, schemas, files on S3, lakes on
  # GCS and Azure, scale, Flight…) in four, each section dealt by its measured time
  # (`harness.py all --shard`), and frames against Polars, the console in Chromium, every example
  # on the website, then a cluster losing its leader twice.
  suite:
    needs: [plan, linux]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.plan.outputs.docs == 'true' }}
    name: suite (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.suite) }} # (the parts what the change touches needs: plan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PONDRA_BIN: ${{ github.workspace }}/bin/pondra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7 # (this run's own, with no API call)
        with:
          name: ${{ needs.plan.outputs.packages }}-linux-x64
          path: dist
      - name: linux-x64's binary
        run: mkdir -p bin && tar xzf dist/pondra-linux-x64.tar.gz -C bin && ls -l bin
      - run: pip install -r tools/requirements.txt
      - uses: actions/cache@v5 # (Apache Kafka for harness.py kafkas: archive.apache.org takes minutes)
        if: matrix.shard
        id: kafka
        with:
          path: ~/kafka_2.13-4.3.1
          key: kafka_2.13-4.3.1
      - name: harness.py all, this part
        if: matrix.shard
        run: |
          npm install -g azurite   # (Azure's emulator: harness.py clouds)
          if [ "${{ steps.kafka.outputs.cache-hit }}" != "true" ]; then
            (curl -sSfL https://dlcdn.apache.org/kafka/4.3.1/kafka_2.13-4.3.1.tgz || curl -sSfL https://archive.apache.org/dist/kafka/4.3.1/kafka_2.13-4.3.1.tgz) | tar xz -C ~
          fi
          python3 tools/harness.py all --shard ${{ matrix.shard }}
      - name: What 1.0 keeps (ADR-068), against main's list
        if: ${{ !matrix.shard }}
        run: |
          git fetch --depth 1 origin main && git show FETCH_HEAD:docs/surface.json > "$RUNNER_TEMP/main-surface.json" || true
          python3 tools/surface.py --bin "$PONDRA_BIN" --check docs/surface.json --base "$RUNNER_TEMP/main-surface.json"
      - name: A node stopped gives its term back, also while it starts (ADR-061)
        if: ${{ !matrix.shard }}
        run: python3 tools/node_check.py --bin "$PONDRA_BIN"
      - name: Frames, the console, the website's examples, a failover
        if: ${{ !matrix.shard }}
        run: |
          python3 tools/frames_check.py
          python3 -m playwright install --with-deps chromium
          python3 tools/brand_check.py --node   # (the mark and colours from brand/ only: ADR-032)
          npm install --no-save --prefix tools axe-core@4.13.0   # (console_check's accessibility audit)
          python3 tools/console_check.py
          python3 tools/docs_check.py   # (every example on the website runs)
          python3 tools/cluster.py failover --secs 30
      - name: The nodes' logs, when a check failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: suite-logs-${{ strategy.job-index }} # (not pondra-…: release.yml takes every pondra-* artifact)
          path: /tmp/pondra-*.stderr
          if-no-files-found: ignore

  # One set of SQL cases on every form (tools/forms_check.py, reviews/form-parity.md): each answers as a node does, or
  # refuses by the name docs/forms.json lists. The page in Node, a node in this process on a folder and in memory, and a
  # node; the train's and main's runs add three nodes. From what linux-x64 and web built: no build of its own.
  forms:
    needs: [plan, linux, web]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.web.result == 'success' && needs.plan.outputs.forms == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.plan.outputs.packages }}-linux-x64
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: web-pkg
          path: web/pkg
      - name: linux-x64's binary, and the library from its wheel
        run: |
          mkdir -p bin && tar xzf dist/pondra-linux-x64.tar.gz -C bin
          unzip -p dist/*.whl 'pondra/_lib/libpondra_lib.so' > bin/libpondra_lib.so && ls -l bin
      - run: pip install pyarrow==25.0.1 numpy # (tools/requirements.txt's pyarrow: slt_check.py reads the answers with it)
      - run: python3 tools/forms_check.py --form page,inprocess,memory,server${{ github.event_name != 'pull_request' && ',cluster' || '' }} --bin bin/pondra --lib bin/libpondra_lib.so --out forms.json
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: forms-failures
          path: forms.json
          if-no-files-found: ignore

  # The tests of what the build made, each a workflow of its own (which also runs by hand), called
  # once linux-x64's build is done (deploy's once every platform's is). A test that waited for the
  # packages inside its own job held a runner all that time, and enough of them held every runner
  # the builds they waited for needed (2026-10-03: 15 runs queued behind them).
  resilience:
    needs: [plan, linux]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.plan.outputs.resilience == 'true' }}
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/resilience.yml
    with:
      artifact: ${{ needs.plan.outputs.packages }}-linux-x64
  upgrade:
    needs: [plan, linux]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.plan.outputs.upgrade == 'true' }}
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/upgrade.yml
    with:
      artifact: ${{ needs.plan.outputs.packages }}-linux-x64
  sharing:
    needs: [plan, linux]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.plan.outputs.sharing == 'true' }}
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/sharing.yml
    with:
      artifact: ${{ needs.plan.outputs.packages }}-linux-x64
  sso:
    needs: [plan, linux]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.plan.outputs.sso == 'true' }}
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/sso.yml
    with:
      artifact: ${{ needs.plan.outputs.packages }}-linux-x64
  deploy:
    needs: [plan, linux, build]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.build.result == 'success' && needs.plan.outputs.deploy == 'true' }}
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/deploy-check.yml
    with:
      from_run: true

  # A push to main whose run failed: the failed jobs named on the pull request it came from, where
  # its lane looks, so a platform that only main builds (the pull request merged on Linux alone) is
  # fixed at once, by whoever merged it. Also in the run's summary, and as an error.
  red:
    needs: [plan, site, web, forms, linux, build, unit, host, suite, resilience, upgrade, sharing, sso, deploy]
    if: ${{ always() && needs.plan.outputs.event == 'push' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          r=$GITHUB_REPOSITORY
          failed=$(gh api "repos/$r/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"')
          # (main runs only its newest commit, so a run may hold several merges: those since the
          # last run that ran, each said on its pull request once)
          prev=$(gh api "repos/$r/actions/workflows/build.yml/runs?branch=main&per_page=30" --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and (.event == \"push\" or .event == \"workflow_dispatch\") and .conclusion != \"cancelled\" and .conclusion != \"skipped\")][0].head_sha // empty" || true)
          shas=$([ -n "$prev" ] && gh api "repos/$r/compare/$prev...$GITHUB_SHA" --jq '.commits[].sha' || echo "$GITHUB_SHA")
          prs=$(for s in $shas; do gh api "repos/$r/commits/$s/pulls" --jq '.[0].number // empty' || true; done | sort -un)
          held=$([ "$(wc -w <<< "$prs")" -lt 2 ] || printf ' This run holds the merges of%s (main builds only its newest commit): the one that broke it fixes it.' "$(printf ' #%s' $prs)")
          body=$(printf "Main's build of %s failed:\n\n%s\n\nThe lane that merged it fixes this next, before other work: a pull request merges on Linux's CI alone, and main builds the other platforms.%s\n" "${GITHUB_SHA:0:7}" "$failed" "$held")
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          for p in $prs; do gh api "repos/$r/issues/$p/comments" -f body="$body" > /dev/null && echo "Said on #$p."; done
          echo "::error title=main is red::$(tr '\n' ' ' <<< "$failed")"
