name: build

# Every push to main: Pondra built as it is released (the dist profile; Linux against glibc 2.17,
# with zig, so it runs on any Linux from 2014 on) for all five platforms, tried there (smoke.py),
# packaged for pip and npm and alone for the one-line installers (tools/package.py), and the
# packages installed and tried as users get them (tools/try_packages.sh). The Linux job then runs
# the suite on its binary, while the others finish (the slowest, macOS Intel, doesn't hold it up).
# A tag's release (release.yml) publishes this run's packages: nothing is built twice, and what
# the suite tested is what ships. A pull request's push runs nothing (its thread builds and tests
# where it works), unless the pull request asks: the label `ci` builds linux-x64 with the suite,
# and `full-ci` all five, as main would, once before it merges. Decided from the labels alone, so a
# push that asks for nothing never waits for a runner to say so; a newer push stops the older run.
# Two pull requests' runs go at once: a third waits, holding no runner, until ci-slots.yml starts it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled] # (labeled: `ci` or `full-ci` added)
  workflow_dispatch:

# A pull request's runs share a group, so a newer push (or `full-ci` added) stops the older run;
# main's never do (each push's packages may be a release's), nor does another label added.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this run builds. A push to main whose code a pull request's run already built and tested
  # on every platform (the merge changed nothing in it: the branch was up to date with main)
  # builds nothing: release.yml and cluster-bench.yml take that run's packages (tools/ci_build.sh
  # finds them by the commit's tree). Otherwise main builds all five. A pull request labelled `ci`
  # builds linux-x64; labelled `full-ci`, all five (and main reuses that run when the tree is the
  # same); with neither, this job and the build are skipped.
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && (github.event.label.name == 'ci' || github.event.label.name == 'full-ci')) ||
      (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'full-ci')))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}
      resilience: ${{ steps.plan.outputs.resilience }}
      upgrade: ${{ steps.plan.outputs.upgrade }}
      deploy: ${{ steps.plan.outputs.deploy }}
      wait: ${{ steps.plan.outputs.wait }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # (a pull request's merge commit and its base: the files it changes, with no API call)
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # (linux-x64 pinned: ubuntu-latest becomes 26.04 from 2026-10-19; moved on purpose, after a
          # green run there. macos-13 was retired; Intel images last until 2027.)
          platforms='[
            {"platform": "linux-x64", "os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "zig": "x86_64-unknown-linux-gnu.2.17"},
            {"platform": "linux-arm64", "os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "zig": "aarch64-unknown-linux-gnu.2.17"},
            {"platform": "macos-x64", "os": "macos-15-intel", "target": "x86_64-apple-darwin"},
            {"platform": "macos-arm64", "os": "macos-latest", "target": "aarch64-apple-darwin"},
            {"platform": "windows-x64", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "exe": ".exe"}]'
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            run=$(bash tools/ci_build.sh "$GITHUB_SHA")
            echo "run=$run" >> "$GITHUB_OUTPUT"
            if [ -n "$run" ]; then echo "Built and tested already: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_STEP_SUMMARY"; fi
          fi
          if [ "$FULL" != true ]; then echo "linux-x64 alone (the label \`ci\`). Before merging, the label \`full-ci\` builds all five platforms." >> "$GITHUB_STEP_SUMMARY"; fi
          echo "matrix=$(jq -c --argjson full "$FULL" '{include: [.[] | select($full or .platform == "linux-x64")]}' <<< "$platforms")" >> "$GITHUB_OUTPUT"
          # The tests of what a pull request's run builds, called below once it is built: upgrade
          # always, resilience when what it puts under failure changes, deploy's (all five
          # platforms: `full-ci`) when what it tries changes. (The files from git: the API's hourly
          # allowance for the repository runs out on a busy day.)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            if grep -qE '^(src/|Cargo\.(toml|lock)$|python/pondra/client\.py$|js/index\.js$|tools/(resilience_check|faulty_s3|sim_r2|harness)\.py$|tools/ci_artifact\.sh$|\.github/workflows/(resilience|build)\.yml$)' <<< "$files"; then resilience=true; else resilience=false; fi
            if [ "$FULL" = true ] && grep -qE '^(deploy/|install\.(sh|ps1)$|src/service\.rs$|tools/(image|deploy_check|distribute|sign|package)\.py$|tools/ci_(artifact|build)\.sh$|\.github/workflows/(deploy|deploy-check|build)\.yml$)' <<< "$files"; then deploy=true; else deploy=false; fi
            printf 'upgrade=true\nresilience=%s\ndeploy=%s\n' "$resilience" "$deploy" >> "$GITHUB_OUTPUT"
            echo "After the build: upgrade$([ "$resilience" = false ] || echo ', resilience')$([ "$deploy" = false ] || echo ', deploy')." >> "$GITHUB_STEP_SUMMARY"
            # At most two pull requests' CI at once (Alimardon, 2026-10-03): with two older runs of
            # other pull requests going, this one waits. It builds nothing, its check `waiting for a
            # CI slot` fails, it holds no runner, and ci-slots.yml starts it again when a run ends.
            # (If the API can't be asked, it runs: a slot is never worth a stuck pull request.)
            going=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=pull_request&per_page=100" \
              --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and .status != \"completed\" and (.pull_requests[0].number // 0) != $PR)] | length") || going=0
            if [ "$going" -ge 2 ]; then
              echo wait=true >> "$GITHUB_OUTPUT"
              echo "Waiting for a CI slot: $going other pull requests' runs are going (two at a time). ci-slots.yml starts this run again when one ends." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  # A pull request over the two at a time: red until it runs, so nobody takes it for passed.
  slot:
    name: waiting for a CI slot
    needs: plan
    if: needs.plan.outputs.wait == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error title=Waiting for a CI slot::Two other pull requests' CI runs are going, and only two run at once. This run starts again by itself when one ends (ci-slots.yml): nothing to do."
          exit 1

  build:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == '' && needs.plan.outputs.wait != 'true' }}
    name: ${{ matrix.platform == 'linux-x64' && 'linux-x64 (build and suite)' || matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # (Git Bash on Windows)
    env:
      BIN: target/${{ matrix.target }}/dist/pondra${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true # (a failed run keeps what it compiled: the dist profile's dependencies take most of a cold build)
          # (main's caches only: every branch reads them, and a branch's own would push them out of
          # the repository's 10 GB; the dependencies are what is cached, and they rarely change)
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: |
          if [ -n "${{ matrix.zig }}" ]; then
            pip install ziglang cargo-zigbuild
            # (zig's linker says, on every build, that it ignores the -Wl,-O1 rustc passes it: not a warning of ours)
            RUSTFLAGS="-A linker_messages" cargo zigbuild --profile dist --target ${{ matrix.zig }}
          else
            cargo build --profile dist --target ${{ matrix.target }}
          fi
      - run: python tools/smoke.py "$BIN" # (on this OS: the shell, SQL, and memory read without /proc)
      # The pip and npm packages and the installers' archive, installed and tried as on a user's
      # machine: packaging that breaks on an OS (npm is npm.cmd on Windows) shows on a push.
      - run: python tools/package.py --bin "$BIN" --platform ${{ matrix.platform }} --npm-main --out dist && bash tools/try_packages.sh ${{ matrix.platform }}
      - name: The Linux wheel on glibc 2.17 (CentOS 7) and on Ubuntu 22.04
        if: matrix.platform == 'linux-x64'
        run: |
          docker run --rm -v "$PWD":/w -w /w quay.io/pypa/manylinux2014_x86_64 bash -c \
            "/opt/python/cp311-cp311/bin/python -m pip install -q --only-binary=:all: dist/*.whl 'pyarrow<19' && /opt/python/cp311-cp311/bin/python tools/package_check.py"
          docker run --rm -v "$PWD":/w -w /w ubuntu:22.04 bash -c \
            "apt-get update -qq && apt-get install -y -qq python3-pip > /dev/null && pip install -q dist/*.whl pyarrow && python3 tools/package_check.py"
      - name: The release's npm publish, tried (--dry-run, with the npm the release uses)
        if: matrix.platform == 'linux-x64'
        run: npm install -g npm@latest && bash tools/npm_publish.sh --dry-run
      - uses: actions/upload-artifact@v6 # (what release.yml publishes, and cluster-bench.yml can run)
        with:
          name: pondra-${{ matrix.platform }}
          path: |
            dist/*.whl
            dist/pondra-${{ matrix.platform }}-*.tgz
            dist/pondra-${{ matrix.platform }}.*
      - uses: actions/upload-artifact@v6 # (`pondra` itself, the same from every platform: published from one)
        if: matrix.platform == 'linux-x64'
        with:
          name: pondra-npm
          path: dist/pondra-[0-9]*.tgz

      # The suite, on this very binary (Linux): the quick correctness suite (upserts, split brain,
      # crashes, clients, Kafka, windows, sums, schemas, files on S3, lakes on GCS and Azure,
      # scale, Flight…), frames against Polars, the console in Chromium, every example on the
      # website, then a cluster losing its leader twice.
      - uses: actions/cache@v5 # (Apache Kafka for harness.py kafkas: archive.apache.org takes minutes)
        if: matrix.platform == 'linux-x64'
        id: kafka
        with:
          path: ~/kafka_2.13-4.3.1
          key: kafka_2.13-4.3.1
      - name: The suite
        if: matrix.platform == 'linux-x64'
        env:
          PONDRA_BIN: ${{ github.workspace }}/${{ env.BIN }}
        run: |
          pip install -r tools/requirements.txt
          npm install -g azurite   # (Azure's emulator: harness.py clouds)
          if [ "${{ steps.kafka.outputs.cache-hit }}" != "true" ]; then
            (curl -sSfL https://dlcdn.apache.org/kafka/4.3.1/kafka_2.13-4.3.1.tgz || curl -sSfL https://archive.apache.org/dist/kafka/4.3.1/kafka_2.13-4.3.1.tgz) | tar xz -C ~
          fi
          python3 tools/harness.py all
          python3 tools/frames_check.py
          python3 -m playwright install --with-deps chromium
          python3 tools/brand_check.py --node   # (the mark and colours from brand/ only: ADR-032)
          npm install --no-save --prefix tools axe-core@4.13.0   # (console_check's accessibility audit)
          python3 tools/console_check.py
          python3 tools/docs_check.py   # (every example on the website runs)
          python3 tools/cluster.py failover --secs 30

  # The tests of what the build made, each a workflow of its own (which also runs by hand), called
  # once the build is done. A test that waited for the packages inside its own job held a runner
  # all that time, and enough of them held every runner the builds they waited for needed
  # (2026-10-03: 15 runs queued behind them).
  resilience:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.resilience == 'true' }}
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/resilience.yml
  upgrade:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.upgrade == 'true' }}
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/upgrade.yml
  deploy:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.deploy == 'true' }}
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/deploy-check.yml
    with:
      from_run: true
