name: resilience

# Pondra under failure, each way it runs (tools/resilience_check.py), with writers and readers
# going the whole time: a bucket that errs, slows, loses replies and goes down; a leader cut off
# from it alone; the Python and JavaScript clients, Postgres, Kafka and Arrow Flight through nodes killed; a
# lake's disk and the nodes' cache disk full; a database's node and its server killed; `pondra
# sql` killed mid-INSERT; the leader's catalog compactor answered a 409, as R2 did on 10-25. Every
# acknowledged write must be there once, on every node. It runs the binary the build workflow made for
# this commit: nothing is compiled here. Its parts run on two runners side by side, about five minutes
# each (one after another on one runner, 9.4 minutes on 10-25, longer than any harness shard).
#
# build.yml calls it once a pull request's build is done (the label `ci` or `full-ci`) and what it
# puts under failure changes: the node, the clients, the check itself. By hand too.
on:
  workflow_call:
    inputs:
      artifact: # (build.yml's packages of linux-x64: pondra-linux-x64, or pr-linux-x64 for a pull request's release-profile build)
        type: string
        default: pondra-linux-x64
  workflow_dispatch:

permissions:
  actions: read # (the build run's packages)
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    name: resilience (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix: # (each part's seconds on 10-25: storage 113, cutoff 65, server 29 | restart 69, clients 34, doors 37, flight 32, disk 66, cache 72, cli 17)
        include:
          - name: a bucket
            parts: storage cutoff catalog server
          - name: nodes, clients, disks
            parts: restart clients doors flight disk cache cli
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: The checks' Python packages (tools/requirements.txt's versions)
        run: pip install --no-compile -r <(grep -iE '^(moto|boto3|psycopg\[|confluent-kafka|pyarrow)' tools/requirements.txt)
      # (Called from build.yml: its run's own packages, with no API call, whatever started that run. By hand: a build run's.)
      - uses: actions/download-artifact@v7
        if: inputs.artifact
        with:
          name: ${{ inputs.artifact }}
          path: dist
      - name: This commit's Linux binary (the build workflow's)
        run: |
          [ -f dist/pondra-linux-x64.tar.gz ] || bash tools/ci_artifact.sh linux-x64 "$SHA"
          mkdir -p bin && tar xzf dist/pondra-linux-x64.tar.gz -C bin && ls -l bin
      - name: The checks (the disks are mounted with sudo)
        env:
          PONDRA_BIN: ${{ github.workspace }}/bin/pondra
        run: python tools/resilience_check.py ${{ matrix.parts }}
      - name: The nodes' logs, when a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-logs-${{ strategy.job-index }}
          path: /tmp/pondra-*.stderr
          if-no-files-found: ignore
