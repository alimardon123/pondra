name: resilience

# Pondra under failure, each way it runs (tools/resilience_check.py), with writers and readers
# going the whole time: a bucket that errs, slows, loses replies and goes down; a leader cut off
# from it alone; the Python and JavaScript clients, Postgres and Kafka through nodes killed; a
# lake's disk and the nodes' cache disk full; a database's node and its server killed; `pondra
# sql` killed mid-INSERT. Every acknowledged write must be there once, on every node. It runs the
# binary the build workflow made for this commit (tools/ci_artifact.sh waits for it): nothing is
# compiled here.
#
# A pull request runs it only when what it puts under failure changes: the node, the clients, the
# check itself.
on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - python/pondra/client.py
      - js/index.js
      - tools/resilience_check.py
      - tools/faulty_s3.py
      - tools/sim_r2.py
      - tools/harness.py
      - tools/ci_artifact.sh
      - .github/workflows/resilience.yml
  workflow_dispatch:

concurrency:
  group: resilience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read # (the build run's packages)
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    name: resilience (${{ matrix.parts }})
    strategy:
      fail-fast: false
      matrix:
        parts: ["storage cutoff", "clients doors server", "disk cache cli"]
    runs-on: ubuntu-24.04
    timeout-minutes: 100 # (most of it waiting for the build's packages)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: The checks' Python packages (tools/requirements.txt's versions)
        run: pip install -r <(grep -iE '^(moto|boto3|psycopg\[|confluent-kafka|pyarrow)' tools/requirements.txt)
      - name: This commit's Linux binary (the build workflow's)
        run: |
          bash tools/ci_artifact.sh linux-x64 "$SHA"
          mkdir -p bin && tar xzf dist/pondra-linux-x64.tar.gz -C bin && ls -l bin
      - name: The checks (the disks are mounted with sudo)
        env:
          PONDRA_BIN: ${{ github.workspace }}/bin/pondra
        run: python tools/resilience_check.py ${{ matrix.parts }}
      - name: The nodes' logs, when a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-logs-${{ strategy.job-index }}
          path: /tmp/pondra-*.stderr
          if-no-files-found: ignore
