# A soak (C4, ADR-039): a cluster on one runner under steady ingest for hours, a node stopped or
# killed now and then, its memory, log, commits and objects on a timeline (tools/soak.py). Started
# by hand (Actions → soak → Run workflow), or by the label `soak` on a pull request: a day on R2
# with the build of its head (five legs of 4.8 hours; the pull request's full-ci run must have
# passed). A runner's job lasts 6 hours at most, so a longer soak is legs (soak-leg.yml), one after
# another on one lake in the bucket: the lake lives the whole day, each node process a leg at most.
#
# storage r2 puts the lake in the bucket of cluster-bench.yml's secrets (R2_*). Mind the free tier:
# each commit is about one object write (durable acknowledgements), so rate / batch commits a second
# is about that many writes a second: 500 / 20 is 25 a second, 90,000 an hour; 500 / 200, a day's,
# 2.5 a second (R2's free tier is a million a month). The timeline says what the run made
# (`object_writes_per_s`).
name: soak

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How long a leg (5.5 at most)"
        default: "5"
      legs:
        description: "Legs, one after another on one lake (1-5; more than one needs storage r2)"
        default: "1"
      rate:
        description: "Rows a second into the stream, in all"
        default: "500"
      batch:
        description: "Rows a batch (a commit each)"
        default: "20"
      nodes:
        description: "Nodes in the cluster"
        default: "3"
      storage:
        description: "local (the runner's disk) or r2 (the bucket)"
        default: "local"
      binary:
        description: "ci (the build workflow's, for this commit: what ships) or build (from source)"
        default: "ci"
  pull_request:
    types: [labeled]

permissions:
  actions: read # (the build workflow's runs)
  contents: read

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'soak'
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - id: plan
        env:
          INPUTS: ${{ toJSON(inputs) }}
          LABELLED: ${{ github.event_name == 'pull_request' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          day = {"legs": "5", "hours": "4.8", "rate": "500", "batch": "200", "nodes": "3", "storage": "r2", "binary": "ci"}
          p = {**(day if os.environ["LABELLED"] == "true" else json.loads(os.environ["INPUTS"])), "sha": os.environ["SHA"]}
          p["legs"] = str(max(1, min(5, int(p.get("legs") or 1))))
          if p["legs"] != "1" and p["storage"] != "r2":
              raise SystemExit("::error::legs need storage r2: a runner's disk goes with its job")
          print(f"plan={json.dumps(p)}\nlegs={p['legs']}")
          EOF
  leg1:
    needs: plan
    uses: ./.github/workflows/soak-leg.yml
    secrets: inherit
    with: { plan: "${{ needs.plan.outputs.plan }}", leg: 1 }
  leg2:
    needs: [plan, leg1]
    if: fromJSON(needs.plan.outputs.legs) >= 2
    uses: ./.github/workflows/soak-leg.yml
    secrets: inherit
    with: { plan: "${{ needs.plan.outputs.plan }}", leg: 2, after: soak-1 }
  leg3:
    needs: [plan, leg2]
    if: fromJSON(needs.plan.outputs.legs) >= 3
    uses: ./.github/workflows/soak-leg.yml
    secrets: inherit
    with: { plan: "${{ needs.plan.outputs.plan }}", leg: 3, after: soak-2 }
  leg4:
    needs: [plan, leg3]
    if: fromJSON(needs.plan.outputs.legs) >= 4
    uses: ./.github/workflows/soak-leg.yml
    secrets: inherit
    with: { plan: "${{ needs.plan.outputs.plan }}", leg: 4, after: soak-3 }
  leg5:
    needs: [plan, leg4]
    if: fromJSON(needs.plan.outputs.legs) >= 5
    uses: ./.github/workflows/soak-leg.yml
    secrets: inherit
    with: { plan: "${{ needs.plan.outputs.plan }}", leg: 5, after: soak-4 }
