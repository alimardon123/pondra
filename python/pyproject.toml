[project]
name = "pondra"
version = "0.33.0"
description = "Pondra, a streamhouse in one binary: the binary, and a Python client (SQL into pandas/Polars/Arrow, exactly-once appends, change feeds)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Alimardon" }]
urls = { Documentation = "https://alimardon123.github.io/pondra/", Repository = "https://github.com/alimardon123/pondra" }
keywords = ["lakehouse", "streaming", "sql", "dataframe", "iceberg", "delta", "kafka", "datafusion"]
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow"]

# SQLAlchemy's dialects (pondra/dialect.py): `create_engine("pondra://…")`, `pondra+http://…`, `pondra+psycopg://…`.
# tools/package.py writes the wheel's entry_points.txt from this table.
[project.entry-points."sqlalchemy.dialects"]
pondra = "pondra.dialect:PondraDialect"
"pondra.pondra" = "pondra.dialect:PondraDialect"
"pondra.http" = "pondra.dialect:PondraHttpDialect"
"pondra.https" = "pondra.dialect:PondraHttpsDialect"
"pondra.psycopg" = "pondra.dialect:PondraDialect_psycopg"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
