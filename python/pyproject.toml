[project]
name = "pondra"
version = "0.23.0"
description = "Pondra, a streamhouse in one binary: the binary, and a Python client (SQL into pandas/Polars/Arrow, exactly-once appends, change feeds)"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Alimardon" }]
urls = { Repository = "https://github.com/alimardon123/pondra" }
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
