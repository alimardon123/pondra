{{- $full := include "pondra.fullname" . -}}
{{/* Made once: an upgrade finds the Secret and keeps what it holds. */}}
{{- define "pondra.kept" -}}
{{- $found := lookup "v1" "Secret" .ns .name -}}
{{- if and $found (index $found.data .key) -}}{{ index $found.data .key }}{{- else -}}{{ randAlphaNum 48 | b64enc }}{{- end -}}
{{- end -}}
{{- if not .Values.secretKey.existingSecret }}
# The key that seals the lake's secrets: every node the same, kept when the chart is upgraded or
# removed (losing it loses the secrets sealed with it).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-key
  labels: {{- include "pondra.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  PONDRA_SECRET_KEY: {{ include "pondra.kept" (dict "ns" .Release.Namespace "name" (printf "%s-key" $full) "key" "PONDRA_SECRET_KEY") }}
{{- end }}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
---
# Tokens at every door: admin (tables, views, users), write (rows) and read.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-tokens
  labels: {{- include "pondra.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range list "PONDRA_ADMIN_TOKEN" "PONDRA_WRITE_TOKEN" "PONDRA_READ_TOKEN" }}
  {{ . }}: {{ include "pondra.kept" (dict "ns" $.Release.Namespace "name" (printf "%s-tokens" $full) "key" .) }}
  {{- end }}
{{- end }}
