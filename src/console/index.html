<!doctype html>
<html lang="en" data-mode="lake" data-version="{{version}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Pondra</title>
<link rel="icon" href="{{favicon}}"><!-- (brand/mark.svg: console.rs) -->
<link rel="stylesheet" href="/console/console.css">
<link rel="preload" href="/console/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="/console/core.js"><link rel="modulepreload" href="/console/editor.js"><link rel="modulepreload" href="/console/grid.js">
<link rel="modulepreload" href="/console/notebook.js"><link rel="modulepreload" href="/console/files.js">
<!-- The console (ADR-030, ADR-032, ADR-034): this page, its style sheet, its modules and its fonts,
     all served by the node (or the server). No CDN, nothing from anywhere else. console.js is the
     shell and its API, `window.pondra`: what extensions (and an enterprise build) add their views,
     kinds of file, answers' views and actions through. -->
</head>
<body>
<header id="top">
  <h1 class="sr">Pondra console</h1>
  <div class="brand">{{mark}}<span>Pondra</span></div>
  <span id="where" class="pill" title="">connecting…</span>
  <div class="center"><button id="search" class="search" title="Search tables, files and commands (Ctrl K)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span>Search tables, files and commands</span><kbd>Ctrl K</kbd></button></div>
  <div id="actions" class="actions"></div>
  <div id="panes" class="panes" role="group" aria-label="Panes"></div>
  <span class="sep"></span>
  <button id="runsBtn" class="icon" title="History: what ran, on the node and on this page" aria-label="History"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
  <button id="jobsBtn" class="icon" title="Jobs: what runs on its own, on a schedule" aria-label="Jobs"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4M8 14h3"/></svg></button>
  <button id="helpBtn" class="icon" title="Keys (?)" aria-label="Keys"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.3c-.7.3-1.2.9-1.2 1.6v.6M12 16.8v.2"/></svg></button>
  <button id="settingsBtn" class="icon" title="Settings" aria-label="Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
  <button id="moreBtn" class="icon" title="More" aria-label="More" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></button>
  <button id="signin" class="btn" title="Sign in: the token this node was started with">Sign in</button>
</header>
<div id="app">
  <nav id="rail" aria-label="Places" hidden></nav>
  <aside id="left" aria-label="Data and workspace"><div id="leftEdge" class="edge" role="separator" aria-orientation="vertical" aria-label="The left pane's width (arrows change it)" tabindex="0"></div></aside>
  <main id="main">
    <div id="tabbar"></div>
    <div id="docbar" class="docbar" role="toolbar" aria-label="The file in front" hidden></div>
    <div id="docs"></div>
  </main>
  <aside id="right" aria-label="Details"><div id="rightEdge" class="edge" role="separator" aria-orientation="vertical" aria-label="The right pane's width (arrows change it)" tabindex="0"></div><div id="rtabs"></div><div id="rbody" role="tabpanel"></div></aside>
</div>
<footer id="statusbar"><div id="stl"></div><div id="str"></div></footer>
<dialog id="tokenDlg"><form method="dialog">
  <h3>Sign in</h3>
  <p id="tokenWhy">The token this node was started with. It is kept in this browser only.</p>
  <input id="userIn" autocomplete="username" spellcheck="false" placeholder="user name (none: a token)" aria-label="User name">
  <input id="tokenIn" type="password" autocomplete="current-password" spellcheck="false" placeholder="password, or a token" aria-label="Password or token">
  <div class="acts"><button class="btn primary" value="ok">Sign in</button><button class="btn" value="cancel">Cancel</button><button class="btn" value="clear">Forget it</button></div>
</form></dialog>
<dialog id="askDlg"><form method="dialog">
  <h3 id="askTitle"></h3>
  <label><span id="askLabel"></span><input id="askIn" autocomplete="off" spellcheck="false"></label>
  <p id="askHint"></p>
  <div class="acts"><button class="btn primary" value="ok">OK</button><button class="btn" value="cancel">Cancel</button></div>
</form></dialog>
<dialog id="palette" class="palette"><form method="dialog">
  <input id="palIn" autocomplete="off" spellcheck="false" placeholder="Search tables, files and commands" aria-label="Search" role="combobox" aria-controls="palList" aria-expanded="true">
  <div id="palList" role="listbox"></div>
</form></dialog>
<div id="menu" class="menu" role="menu" hidden></div>
<div id="complete" class="complete" role="listbox" hidden></div>
<div id="toast" role="status"></div>
<script type="module" src="/console/console.js"></script>
<!--{{extensions}}-->
</body>
</html>
