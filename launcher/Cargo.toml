[package]
name = "pondra-launcher"
version = "0.33.0"
edition = "2021"
description = "Pondra's launcher: the `pondra` command of the packages, which loads libpondra and runs its program"
license = "MIT OR Apache-2.0"
publish = false # (not on crates.io: the packages carry it)

# (named apart from the program's `pondra`, so a workspace build never writes both to one file; the
# packages install it as `pondra`: `tools/package.py --launcher`)
[[bin]]
name = "pondra-launcher"
path = "src/main.rs"

# Unix only: dlopen. Windows declares its two kernel32 functions itself (main.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
