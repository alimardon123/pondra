[package]
name = "pondra"
version = "0.34.0"
edition = "2021"
description = "Pondra: a streamhouse in one binary"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alimardon123/pondra"
publish = false # (not on crates.io yet: pip and npm carry the binary)

[features]
default = ["server"]
# A node: the lake and its doors. Without it the library is the parts a browser build shares (`src/lib.rs`).
server = ["lake", "doors"]
# What answers a statement: the store, catalog, log, writes, DDL, transactions, queries, views and the rest
# (designs/page-same-core.md §1). A page is to build it too: the deps here that a page can't build (SlateDB, moka,
# aws-lc-rs, sysinfo, libc, tonic, tokio-rustls) go behind the platform layer, and `cargo check --no-default-features
# --features lake` counts what is left.
lake = ["dep:http", "dep:slatedb", "dep:reqwest", "tokio/full", "dep:toml", "dep:chrono-tz", "dep:postgres-types",
        "dep:zstd", "dep:object_store", "dep:object_store_df", "dep:aws-lc-rs", "dep:sysinfo", "dep:libc", "dep:moka",
        "dep:arrow-flight", "dep:tonic", "dep:prost", "dep:tokio-rustls", "dep:rustls-platform-verifier",
        "dep:sha1", "dep:sha2", "dep:hmac", "dep:subtle", "dep:getrandom"]
# What listens and how a node is run: the HTTP, Postgres, Kafka and Flight doors, the cluster's own calls, the command
# line and the service. A module is `lake` unless it is one of these; what reaches outside to answer a statement (Python,
# Git, another Kafka cluster, a function's Flight server) is lake, and on a page it is the platform's or refused by name.
doors = ["lake", "dep:axum", "dep:clap", "dep:mimalloc", "dep:pgwire", "dep:windows-service", "dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tower", "dep:http-body-util", "dep:log"]
# jemalloc's heap profiling and statistics built in (Linux), for a soak whose nodes dump their
# heaps: soak.yml's `binary: heap`, read by tools/heap_report.py. Off unless asked: a node built
# with it profiles nothing until `_RJEM_MALLOC_CONF` says `prof:true`.
heap-profile = ["tikv-jemallocator?/profiling", "tikv-jemallocator?/stats"]

[workspace]
members = ["capi", "launcher"] # (pondra_lib, the C ABI, and the launcher that loads it: `cargo build --workspace` builds them with the program, into one folder; a plain build at the root builds the program alone)
exclude = ["web"] # (the page form's module: a workspace of its own for wasm32, built by tools/web_build.sh)

[lib]
doctest = false # (the modules' docs are prose and SQL, not Rust examples)

[[bin]]
name = "pondra"
required-features = ["server"] # (the program is a node's command line)

[dependencies]
parquet = { version = "59", default-features = false, features = ["snap", "zstd", "lz4"] }
datafusion = { version = "55", default-features = false, features = ["parquet", "sql", "nested_expressions", "datetime_expressions", "string_expressions", "unicode_expressions", "regex_expressions", "crypto_expressions", "encoding_expressions"] }
arrow-ipc = { version = "59", features = ["zstd"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"], optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true } # (a library's request handed to the router: `library.rs`; already built for axum)
http-body-util = { version = "0.1", optional = true } # (a body capped at a size: Flight's calls before their caller signs in; already built for axum)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] } # (raw_value: Delta's decimal statistics read as written, read_delta.rs; a node has it through axum, a page only through this)
jiter = "0.17" # (a JSON walk that reads only the bytes it needs: `pg_json.rs`; already in Cargo.lock through datafusion-functions-json)
anyhow = "1"
log = { version = "0.4", optional = true } # (SlateDB's error records, which the command says on stderr: `cli::main`; already in Cargo.lock)
toml = { version = "0.8", default-features = false, features = ["parse"], optional = true } # pondra.toml (already built for slatedb's figment)
bytes = "1"
uuid = { version = "1", features = ["v4", "v7"] } # (every form: the casts' functions, `pg_casts.rs`, make and check uuids on a page too)
clap = { version = "4", features = ["derive"], optional = true }
futures = "0.3"
async-trait = "0.1"
lru = "0.18"
chrono = { version = "0.4", default-features = false } # (already built for object_store: ObjectMeta timestamps)
chrono-tz = { version = "0.10", default-features = false, optional = true } # (already built for arrow: time zones; tasks' cron schedules)
url = "2"
http = { version = "1", optional = true } # (an AWS catalog's requests signed by object_store's signer, which takes http's; already built for reqwest)
datafusion-functions-json = "0.55" # json_get(…), ->, ->> over JSON strings (Kafka raw values, semi-structured columns)
datafusion-spark = "55.1" # Spark's functions DataFusion doesn't name itself (format_string, pmod, parse_url…): PySpark's vocabulary in SQL
regex = "1" # (COPY FROM: its NULL string; already built for arrow-csv)
csv-core = "0.1.13" # (the CSV reader Arrow reads with: a COPY INTO refusal's line is found by reading the file as it does)
postgres-types = { version = "0.2", optional = true } # (DECIMAL as NUMERIC over the Postgres protocol; already built for pgwire)
pgwire = { version = "0.41", default-features = false, features = ["server-api-aws-lc-rs", "pg-type-chrono"], optional = true } # the Postgres wire protocol (psql, drivers, BI tools); TLS as sslmode=require asks
prost = { version = "0.14", default-features = false, optional = true }
base64 = "0.22" # (Flight's basic-auth handshake; already built for object_store)
# Kafka record batches: their compression codecs and CRC (all already built for parquet, arrow and object_store)
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
lz4_flex = { version = "0.14", default-features = false, features = ["frame"] }
snap = "1"
zstd = { version = "0.13", optional = true }
crc-fast = "1.10"
# S3 / R2 / MinIO. SlateDB and our own I/O use object_store 0.14; DataFusion 55 reads through 0.13.
object_store_df = { package = "object_store", version = "0.13", default-features = false, optional = true }
glob = "0.3" # (a URL's glob: DataFusion splits only paths'; already built for it)

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["sync", "rt"] } # (asof.rs's OnceCell in every build; `server` adds the rest: "tokio/full")
# What a page can't build, though the lake names it: a page has its own catalog store (`kv`), seal and hashes (`crypto`),
# memory reading and no gRPC or TLS sockets (designs/page-same-core.md §5). Each is still `lake`'s, in `[features]`.
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "http"], optional = true } # (files outside the lake too: ADR-026)
slatedb = { version = "0.16", default-features = false, features = ["aws", "moka"], optional = true } # moka: in-memory block cache (foyer adds a disk tier we don't need)
moka = { version = "0.12.8", features = ["future"], optional = true } # (the catalog's block caches, as slatedb's own over the same moka, saying what they hold: `store::blocks`)
# Arrow Flight and Flight SQL (gRPC): ADBC, JDBC and pyarrow clients, columnar in and out
arrow-flight = { version = "59", features = ["flight-sql"], optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "router"], optional = true }
aws-lc-rs = { version = "1", optional = true } # (secrets sealed with AES-256-GCM: already built for object_store's TLS)
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"], optional = true } # (Kafka clusters over TLS: already built for reqwest)
rustls-platform-verifier = { version = "0.7", optional = true } # (…checked against the system's certificates, as reqwest does)
sysinfo = { version = "0.35", default-features = false, features = ["system"], optional = true } # (RAM and resident memory where there is no /proc: Windows, macOS; already built for SlateDB)

# (a page's stand-in for tokio: sleeps, timeouts and tasks over the browser, `web/tokio`, named `tokio` in `lib.rs`: Cargo
# refuses one name with two sources across targets)
[target.'cfg(target_arch = "wasm32")'.dependencies]
pondra-tokio-web = { path = "web/tokio" }
object_store = { version = "0.14", default-features = false, features = ["aws-base", "gcp-base", "azure-base", "http-base", "reqwest"], optional = true } # (the bucket clients over the browser's fetch, without the TLS and aws-lc-rs a page can't build: their crypto is crypto.rs's)
# (a page's crypto: crypto.rs's page bodies, RustCrypto and getrandom in a browser; a node's are aws-lc-rs)
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
subtle = { version = "2.6", optional = true }
getrandom = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true } # (free disk space: statvfs)

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true, features = ["background_threads", "disable_initial_exec_tls"] } # (the program's allocator on Linux: `main.rs`; its features as the library's, `capi/`, so one build makes both)
tikv-jemalloc-sys = { version = "0.7", optional = true } # (jemalloc's own calls: its statistics on `/metrics`, `metrics::allocator`, and the request meter's thread counters, `oom.rs`; already built for tikv-jemallocator)

[target.'cfg(not(all(target_os = "linux", target_env = "gnu")))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"], optional = true } # (the program's allocator but on Linux: `main.rs`; its features as the library's, `capi/`, so one build makes both)

[target.'cfg(windows)'.dependencies]
windows-service = { version = "0.8", optional = true } # (`pondra service` on Windows: the service manager's dispatcher; its windows-sys is already built for tokio)

# (the native tests build a page's crypto bodies, `crypto.rs`, to compare them with the node's: the same crates a page has)
[dev-dependencies]
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
getrandom = "0.3"

[profile.release]
# (panics unwind: a request's is answered as an error; the node's own loops still stop it: `panics.rs`)
codegen-units = 16
incremental = true

# Size-optimized build used for the binary-size / idle-memory measurements.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
opt-level = 3
incremental = false
strip = true
